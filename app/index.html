<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ed" />
    <meta name="description" content="基于剑桥 A2 Key 官方词汇表的背单词应用，1723 个词条，支持双向背诵与跨设备同步。" />
    <title>KET 词匣</title>

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/favicon.png" />

    <!-- iOS 主屏：standalone 全屏、状态栏样式、图标 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KET 词匣" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- Android/桌面：主题色与移动端体验 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!--
      启动画面。
      内联在此处而不是放在 React 里：用户拿到 HTML 的瞬间就能看到反馈，
      不用等 JS 下载 + 解析 + 首帧渲染（那正是白屏最久的一段）。
      React 挂载后由 main.tsx 移除 #boot。
    -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: #f7f4ed; color: #17202a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        transition: opacity .28s ease;
      }
      #boot.boot-done { opacity: 0; pointer-events: none; }
      #boot .mark {
        width: 64px; height: 64px; border-radius: 16px;
        background: #176b5b;
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: 800; color: #f7f4ed;
        box-shadow: 0 8px 24px rgba(23, 107, 91, .18);
      }
      #boot .title { margin-top: 18px; font-size: 19px; font-weight: 800; letter-spacing: .02em; }
      #boot .hint { margin-top: 6px; font-size: 13px; color: #8a8378; }
      #boot .track {
        margin-top: 22px; width: 156px; height: 3px; border-radius: 99px;
        background: rgba(23, 107, 91, .14); overflow: hidden;
      }
      /* 不确定进度条：无法预知真实耗时时，用循环滑动比假装百分比诚实 */
      #boot .bar {
        width: 46%; height: 100%; border-radius: 99px; background: #176b5b;
        animation: boot-slide 1.1s cubic-bezier(.4, 0, .2, 1) infinite;
      }
      @keyframes boot-slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(320%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .bar { animation: none; width: 100%; opacity: .55; }
        #boot { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="mark">K</div>
      <p class="title">KET 词匣</p>
      <p class="hint" id="boot-hint">正在加载…</p>
      <div class="track"><div class="bar"></div></div>
    </div>
    <div id="root"></div>
    <noscript>
      <div style="padding:24px;text-align:center;font-family:sans-serif">
        <h1>需要启用 JavaScript</h1>
        <p>此应用依赖 JavaScript 运行，请在浏览器设置中开启后刷新页面。</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
